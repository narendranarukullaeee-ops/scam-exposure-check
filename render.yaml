services:
  - type: web
    name: exposure-check
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: brevo
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: HIBP_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
